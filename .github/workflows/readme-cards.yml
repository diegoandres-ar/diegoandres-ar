name: Update README cards

on:
  schedule:
    # Daily at 06:00 UTC (~01:00 in Colombia)
    - cron: "0 6 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/readme-cards.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # STATS_TOKEN = classic PAT with `repo` + `read:user` scopes.
      # Required to include private repositories. Without it, the workflow
      # still works but only counts public data.
      - name: Generate stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&rank_icon=github&hide=stars,issues,contribs&theme=dark_github
          path: profile/stats-dark.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          # If the token expires or the API fails, keep the last good SVG
          # instead of committing an error card.
          fail_on_error: true

      - name: Generate stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&rank_icon=github&hide=stars,issues,contribs&theme=light_github
          path: profile/stats-light.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          # If the token expires or the API fails, keep the last good SVG
          # instead of committing an error card.
          fail_on_error: true

      - name: Generate top languages card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&count_private=true&theme=dark_github
          path: profile/top-langs-dark.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          # If the token expires or the API fails, keep the last good SVG
          # instead of committing an error card.
          fail_on_error: true

      - name: Generate top languages card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&count_private=true&theme=light_github
          path: profile/top-langs-light.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          # If the token expires or the API fails, keep the last good SVG
          # instead of committing an error card.
          fail_on_error: true

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update README cards"
            git push
          fi
